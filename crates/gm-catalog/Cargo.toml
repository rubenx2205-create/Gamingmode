[package]
name = "gm-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gm-core.workspace = true
serde_json.workspace = true

# La conexion usa la pila TLS del propio Windows (schannel) en vez de empotrar
# rustls/openssl en el binario: menos peso y menos superficie que mantener.
[target.'cfg(windows)'.dependencies]
ureq = { version = "2.10", default-features = false, features = ["native-tls", "gzip", "json"] }
native-tls = "0.2"
