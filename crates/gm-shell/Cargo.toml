[package]
name = "gm-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "gamingmode"
path = "src/main.rs"

[dependencies]
gm-core.workspace = true
gm-input.workspace = true
gm-power.workspace = true
gm-catalog.workspace = true
log.workspace = true
serde.workspace = true
# wgpu como backend: el render es de GPU y el shell puede quedarse a 1 fps
# mientras se juega sin dejar de responder.
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.29"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
# Decodifica las caratulas descargadas (SteamGridDB) para subirlas como
# textura. Sin soporte de red propio: solo lee bytes ya guardados en disco.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Leer el portapapeles para el boton "Pegar" de la clave de SteamGridDB. Ya
# viene con eframe de todas formas (lo usa para copiar/pegar texto); se declara
# aparte solo para poder llamarlo a mano desde un boton del mando.
arboard = { version = "3", default-features = false }

# Fuera de Windows winit necesita un backend de ventanas para compilar. No es
# una plataforma soportada del producto, pero permite ejecutar en Linux las
# pruebas de navegacion y de tema durante el desarrollo.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "x11"] }

# Incrusta el icono (assets/icon.ico) en el .exe: rc.exe en MSVC, windres en
# GNU. No hace nada fuera de Windows (ver build.rs).
[build-dependencies]
winresource = "0.1"
